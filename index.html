<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Simulation Log — AI, Technology & Frontier Science</title>
    <meta name="description" content="Independent tech news publication covering artificial intelligence, space exploration, energy, and scientific discovery.">
    <link rel="canonical" href="https://thesimulationlog.com/">

    <meta property="og:type"        content="website">
    <meta property="og:title"       content="The Simulation Log">
    <meta property="og:description" content="Independent tech news covering AI, space, energy, and scientific discovery.">
    <meta property="og:url"         content="https://thesimulationlog.com/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style.css">
    <script src="/js/nav.js"></script>
    <script src="/js/home.js" defer></script>
</head>
<body>

<div id="nav-mount"></div>

<main>
    <div class="page-wrap">

        <!-- Hero article (JS renders here) -->
        <section id="hero-section" aria-label="Featured story"></section>

        <!-- Latest stories grid -->
        <div class="section-head">
            <h2 class="section-title">Latest Stories</h2>
            <span class="section-count" id="story-count"></span>
        </div>

        <div class="article-grid" id="article-grid" aria-live="polite">
            <!-- Injected by home.js -->
        </div>

    </div>
</main>

<div id="footer-mount"></div>

</body>
</html>
